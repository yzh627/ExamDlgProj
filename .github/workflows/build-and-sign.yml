name: Build and Sign

# 这个工作流同时负责两件事：
#   1) 在 Windows 上从源码完整重建安装包（SignPath Foundation 要求构建全自动、可审查）
#   2) 提交给 SignPath 换取免费的 OV 代码签名（未配置密钥时自动跳过，不会把流程跑断）
#
# 为什么要 CI：SignPath 明确要求"构建过程完全自动化"。
# 它要把"仓库里的源码 → 学生手上的 exe"这条链证明给你看，
# 本地手工编译再上传是不被接受的（否则就等于"谁都能拿 OV 证书签任意程序"）。
#
# 需要配置的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   SIGNPATH_API_TOKEN          SignPath 后台创建，权限选 Submitter
#   SIGNPATH_ORGANIZATION_ID    后台 URL 里那串 GUID
#   SIGNPATH_PROJECT_SLUG       项目标识
#   SIGNPATH_SIGNING_POLICY_SLUG 通常是 release-signing
# 一个都没配也能跑：只是产物保持未签名。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Visual Studio 2022 with C++ toolchain
        uses: microsoft/setup-msbuild@v2

      - name: Install C++ workload and Windows SDK
        # 这一步是必须的：setup-msbuild 只装 MSBuild 本体，不含 C++ 编译器。
        # 少了它，rebuild.ps1 里的 Find-VcTools 会返回 null 并直接抛
        # "[错误] 没找到 Visual Studio 的编译工具或 Windows SDK"，
        # 而报这个错看不出是"工具没装"造成的，很容易误判。
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:GITHUB_WORKSPACE 'install-vs.log'
          # 用 vs_installer 静默装 C++ 桌面开发工作负载 + Windows 11 SDK
          $args = @(
            'modify',
            '--installPath', "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise",
            '--add', 'Microsoft.VisualStudio.Workload.VCTools',
            '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
            '--add', 'Microsoft.VisualStudio.Component.VC.CMake.Project',
            '--includeRecommended',
            '--noRestart',
            '--quiet',
            '--wait',
            '--norestart'
          )
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath 2>$null
          if (-not $installPath) {
            Write-Host "未检测到带 C++ 的 VS，用 setup-msbuild 装到默认位置"
            $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            $rawArgs = 'modify --installPath "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise" ' +
                       '--add Microsoft.VisualStudio.Workload.VCTools ' +
                       '--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 ' +
                       '--includeRecommended --noRestart --quiet --wait --norestart'
            $p = Start-Process -FilePath $setup -ArgumentList $rawArgs -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -notin @(0, 3010)) {
              throw "Visual Studio C++ 工作负载安装失败，退出码 $($p.ExitCode)。日志：$log"
            }
          } else {
            Write-Host "已具备 C++ 工具链：$installPath"
          }
          # 验证一遍：确认 cl.exe 真的能编译，别等 rebuild 才炸
          $vcRoot = & $vswhere -latest -products * -property installationPath
          $cl = Get-ChildItem -Path (Join-Path $vcRoot 'VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe') -ErrorAction SilentlyContinue |
                Select-Object -First 1
          if (-not $cl) { throw "C++ 编译器仍不可用（cl.exe 找不到）" }
          Write-Host "编译器就位：$($cl.FullName)"
          & $cl.FullName 2>&1 | Select-Object -First 1 | Write-Host

      - name: Build (x64 + x86 + installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # rebuild.ps1 会自己找 VS 与 SDK，找不到就抛错，这正是我们想要的失败方式
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools\rebuild.ps1
          if ($LASTEXITCODE -ne 0) { throw "构建失败，退出码 $LASTEXITCODE" }

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          # 只把待签名的可执行文件交给 SignPath。
          # 签名是逐文件的：安装器内嵌的主程序、卸载器都在安装包内部，
          # 它们在【本机安装时】才被释放出来，所以每个二进制都要单独签，
          # 否则 Smart App Control 会因为执行链上有未签名项而整体拦截。
          Copy-Item '发布包\对口升学练习系统_安装程序.exe' out\ -Force
          Copy-Item '发布包\ExamDlgProj.exe'            out\ -Force
          Copy-Item '发布包\ExamDlgProj_32位.exe'       out\ -Force
          Copy-Item '安装程序\Uninst.exe'               out\ -Force
          Get-ChildItem out | Format-Table Name, Length

      # ---- 以下是签名环节：没配密钥就跳过，产物仍为未签名 ----
      - name: Check SignPath configuration
        id: signpath
        shell: pwsh
        run: |
          $has = [bool]($env:SIGNPATH_API_TOKEN -and $env:SIGNPATH_ORGANIZATION_ID)
          "enabled=$has" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($has) {
            "SignPath 已配置，产物将被签名。"
          } else {
            "SignPath 未配置，产物保持未签名（不会中断构建）。"
          }

      # SignPath 只要求把文件作为 GitHub Artifact 上传，它自己会去拉。
      # 必须是 upload-artifact v4：SignPath 的 action 需要 v4 产出的 artifact-id。
      - name: Upload unsigned build for signing
        id: upload-unsigned
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: out/*.exe
          if-no-files-found: error

      # ★ 签名与下载由【同一个 action】完成 —— 不存在单独的 "get-signed-artifact" action。
      #   之前误写了 signpath/github-action-get-signed-artifact，报"找不到匹配的版本"。
      #   正确做法：submit-signing-request 配 wait-for-completion + output-artifact-directory，
      #   它会阻塞等签名完成，然后把已签名的文件解包到指定目录。
      - name: Sign with SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          # GitHub 默认把 artifact 打成 zip，SignPath 的工件配置要求根元素就是 zip
          parameters: |
            Version: ${{ github.ref_name }}

      # 拿到签名产物后必须复验：SignPath 有可能因为策略不匹配而没签，
      # 静默通过"未签名"这一步是最危险的 —— 会被当成已签名发布出去。
      - name: Verify signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 两个目录都要看：signed\ 是 SignPath 签好的，out\ 是原始未签名的。
          # 只看 out\ 会永远显示"未签"，那不是问题，是看错了目录。
          foreach ($dir in @('out', 'signed')) {
            if (-not (Test-Path $dir)) { continue }
            Write-Host ""
            Write-Host "=== 目录 $dir ==="
            Get-ChildItem $dir -Filter *.exe | ForEach-Object {
              $sig = Get-AuthenticodeSignature -LiteralPath $_.FullName
              $ts  = if ($sig.TimeStamperCertificate) { '有时间戳' } else { '缺时间戳' }
              if ($sig.Status -eq 'Valid') {
                Write-Host "[已签] $($_.Name)  签名者=$($sig.SignerCertificate.Subject)  $ts"
              } else {
                Write-Host "[未签] $($_.Name)  状态=$($sig.Status)"
              }
            }
          }
          # 有 signed 目录却一个都没签成功，才是真问题
          if (Test-Path 'signed') {
            $signedOk = @(Get-ChildItem signed -Filter *.exe | Where-Object {
                (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -eq 'Valid' })
            if ($signedOk.Count -eq 0) {
              Write-Warning "signed 目录里没有任何有效签名。检查 SignPath 后台的签名请求是否被拒绝。"
            } else {
              Write-Host ""
              Write-Host "签名成功 $($signedOk.Count) 个文件。"
            }
          }
          Write-Host ""
          Write-Host "SHA256 清单："
          Get-ChildItem out -Filter *.exe | Get-FileHash -Algorithm SHA256 |
            Format-Table Hash, @{n='File';e={Split-Path $_.Path -Leaf}} -AutoSize

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            out/*.exe
            signed/*.exe
          if-no-files-found: error
